<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>POSMATE — เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <div id="login-screen" class="login-page">
      <div class="login-card">
        <div class="login-logo">
          <h1>POSMATE</h1>
          <p>ระบบ POS สำหรับร้านค้าขนาดเล็ก–กลาง</p>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="email">อีเมล</label>
            <input type="email" id="email" class="form-control" placeholder="admin@shop.com" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
            เข้าสู่ระบบ
          </button>
        </form>
        <p class="text-center text-muted mt-2" style="font-size:0.8rem;">
          POSMATE v1.0
        </p>
      </div>
    </div>
    <div id="main-app" class="app hidden">
      <header class="header">
        <div>
          <h1>POSMATE</h1>
          <div class="sub" id="header-user">-</div>
        </div>
        <button class="btn btn-sm btn-outline" id="btn-logout" style="color:#fff;border-color:rgba(255,255,255,.6);background:transparent;">
          ออก
        </button>
      </header>
      <main class="main" id="page-content"></main>
      <nav class="bottom-nav" id="bottom-nav">
        <a href="#dashboard" data-page="dashboard" class="active"><span class="icon">🏠</span>หน้าหลัก</a>
        <a href="#pos" data-page="pos"><span class="icon">🛒</span>ขาย</a>
        <a href="#history" data-page="history"><span class="icon">📋</span>ประวัติ</a>
        <a href="#products" data-page="products"><span class="icon">📦</span>สินค้า</a>
        <a href="#employees" data-page="employees"><span class="icon">👥</span>พนักงาน</a>
        <a href="#settings" data-page="settings"><span class="icon">⚙️</span>ตั้งค่า</a>
      </nav>
    </div>
  </div>
  <div class="modal-overlay" id="pin-modal">
    <div class="modal">
      <h2>เลือกพนักงาน</h2>
      <div class="form-group">
        <label>รหัสพนักงาน</label>
        <input type="text" id="emp-code" class="form-control" placeholder="เช่น 001" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>PIN (4–6 หลัก)</label>
        <input type="password" id="emp-pin" class="form-control pin-input" placeholder="••••" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn btn-primary btn-block" id="btn-switch-emp">ยืนยัน</button>
      <button class="btn btn-outline btn-block mt-1" id="btn-close-pin">ยกเลิก</button>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
